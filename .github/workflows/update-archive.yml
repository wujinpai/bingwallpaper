name: Update Archive

on:
  schedule:
    # UTC 10:39 & 18:39
    # 北京 18:39 & 02:39
    # 一天两次是冗余：只留 zh-CN 后一天只有一张新图，一次定时抓到即 push，
    # 另一次发现已存在便跳过，不会重复 push、也不会一天构建两次。
    # 若某次因网络失败没抓到，另一次会补上。
    - cron: '39 10,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 直连 Bing 抓取，不依赖线上站点是否可用
      - name: Fetch latest wallpaper from Bing
        run: node scripts/update-archive.mjs

      - name: Commit archive changes
        id: commit
        env:
          USER_NAME: ${{ vars.USER_NAME }}
          USER_EMAIL: ${{ vars.USER_EMAIL }}
        run: |
          # 未配置 USER_NAME / USER_EMAIL 时回退到 GitHub Actions 机器人身份，保证开箱可用
          git config user.name "${USER_NAME:-github-actions[bot]}"
          git config user.email "${USER_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git status --short

          if [ -z "$(git status --porcelain ./archive)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "archive is already up to date"
            exit 0
          fi

          git add ./archive
          git commit -m "ci: update archive $(date --iso-8601=seconds)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 构建校验：确认新数据能正常生成整站。.output/ 不提交，
      # 线上部署由 EdgeOne Pages 的 Git 集成在 push 后自动构建。
      - name: Verify site builds
        run: node scripts/build.mjs
